# Deploy da API no App Service BlueHawkAPI (Brazil South).
#
# O arquivo gerado pelo Centro de Implantação tentava enviar a imagem para mcr.microsoft.com (o registro
# público da Microsoft, onde ninguém de fora publica), porque o app foi criado com a imagem de exemplo
# appsvc/staticsite. Aqui a imagem vai para o GHCR, como no prd_bluehawk.yml, e o app baixa de lá
# (o pacote é público, então não precisa de credencial de registro).

name: Build and deploy BlueHawkAPI

on:
  push:
    branches: [prd]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cauabertolini/bluehawk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Necessário para o login OIDC
      contents: read
    steps:
      # Login na Azure via OIDC, com a identidade criada pelo Centro de Implantação para o BlueHawkAPI
      - name: Login na Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2D7B7C24C8DB4CD4AEF03B706EE2E422 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47B1E522BEC74F1890FBB55A910D064F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_053D9F8AEFF545628717C82DF975D0DF }}

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: BlueHawkAPI
          images: ghcr.io/cauabertolini/bluehawk:${{ github.sha }}
