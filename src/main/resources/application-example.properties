# Copie este arquivo para application.properties (ignorado pelo Git) e ajuste os valores.
spring.application.name=blue-hawk

# Configuracoes do PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blue_hawk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sua_senha_aqui}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Desabilita a conversao de CamelCase para snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ProblemDetails
spring.mvc.problemdetails.enabled=true

# JWT (gere um segredo proprio com 32+ caracteres; nao use este valor fora do ambiente local)
security.jwt.secret=${JWT_SECRET:troque-por-um-segredo-com-pelo-menos-32-caracteres}
security.jwt.expiration-seconds=86400
# Segundos em que o token antigo ainda vale depois de renovado (requisicoes em paralelo)
security.jwt.rotation-grace-seconds=30

# CORS: origens do front autorizadas a chamar a API, separadas por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload de foto de capa (até 2 MB, checado no caso de uso) e do avatar (até 3 MB); o front reduz antes de enviar
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Token recem-emitido nao e renovado de novo antes deste tempo (evita assinar um token por requisicao)
security.jwt.rotation-min-age-seconds=60

# Limite de requisicoes por IP (responde 429 acima disso); 0 desliga a regra
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.general-per-minute=600
app.rate-limit.write-per-minute=120
app.rate-limit.login-per-minute=10
app.rate-limit.signup-per-hour=20
# Tamanho maximo do corpo JSON, em bytes (uploads de imagem seguem o limite do multipart)
app.rate-limit.max-body-bytes=262144
# true quando a API fica atras de um proxy confiavel que acrescenta o IP real ao fim do X-Forwarded-For
# (no Azure App Service isso e detectado sozinho). Deixe false se a API recebe conexoes diretas.
app.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

# Swagger (/swagger-ui e /v3/api-docs): ligue so em desenvolvimento, com SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# WebSocket de tempo real (/ws): limites de conexoes (acima disso fecha com 4429) e de uso por conexao
app.realtime.max-connections=5000
app.realtime.max-connections-per-ip=100
app.realtime.max-connections-per-user=8
app.realtime.max-messages-per-minute=60
# Segundos sem trafego ate o servidor fechar a conexao (o cliente manda ping a cada 25 s)
app.realtime.idle-timeout-seconds=180
